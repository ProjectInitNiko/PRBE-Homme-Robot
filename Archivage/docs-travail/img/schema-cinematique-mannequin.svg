<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="ball" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#9db8e0"/>
      <stop offset="100%" stop-color="#3f5d96"/>
    </radialGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d3e4"/>
      <stop offset="50%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#c8d3e4"/>
    </linearGradient>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#94a0b5" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>

  <!-- Titre -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2b46">Schéma cinématique normalisé du mannequin humain — 22 DDL</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#5a6a85">Convention liaisons mécaniques (NF EN ISO 3952) — modèle Niko_v2_PRBE</text>

  <!-- ===== Corps rigide (encastrement) : tête + cou + tronc ===== -->
  <circle cx="480" cy="120" r="24" fill="#eef1f6" stroke="#3a4659" stroke-width="2"/>
  <circle cx="480" cy="120" r="24" fill="url(#hatch)" opacity="0.22"/>
  <line x1="480" y1="144" x2="480" y2="166" stroke="#3a4659" stroke-width="8"/>
  <rect x="425" y="165" width="110" height="190" rx="16" fill="#eef1f6" stroke="#3a4659" stroke-width="2"/>
  <rect x="425" y="165" width="110" height="190" rx="16" fill="url(#hatch)" opacity="0.22"/>

  <!-- ===== Segments (membres) ===== -->
  <g stroke="#444" stroke-width="7" stroke-linecap="round">
    <!-- Bras D -->
    <line x1="433" y1="185" x2="370" y2="290"/>
    <line x1="370" y1="290" x2="348" y2="385"/>
    <line x1="348" y1="385" x2="343" y2="420"/>
    <!-- Bras G -->
    <line x1="527" y1="185" x2="590" y2="290"/>
    <line x1="590" y1="290" x2="612" y2="385"/>
    <line x1="612" y1="385" x2="617" y2="420"/>
    <!-- Jambe D -->
    <line x1="450" y1="350" x2="445" y2="520"/>
    <line x1="445" y1="520" x2="443" y2="675"/>
    <line x1="443" y1="675" x2="408" y2="692"/>
    <!-- Jambe G -->
    <line x1="510" y1="350" x2="515" y2="520"/>
    <line x1="515" y1="520" x2="517" y2="675"/>
    <line x1="517" y1="675" x2="552" y2="692"/>
  </g>
  <circle cx="343" cy="420" r="5" fill="#444"/>
  <circle cx="617" cy="420" r="5" fill="#444"/>

  <!-- ===== Symboles de liaison ===== -->
  <!-- Rotules (épaules + hanches) -->
  <g stroke="#2f4a78" stroke-width="1.5">
    <circle cx="433" cy="185" r="13" fill="url(#ball)"/>
    <circle cx="527" cy="185" r="13" fill="url(#ball)"/>
    <circle cx="450" cy="350" r="13" fill="url(#ball)"/>
    <circle cx="510" cy="350" r="13" fill="url(#ball)"/>
  </g>

  <!-- Pivots (coudes + genoux + chevilles) : cylindre horizontal -->
  <g>
    <!-- coude D -->
    <g transform="translate(370,290)"><line x1="-22" y1="0" x2="22" y2="0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
    <!-- coude G -->
    <g transform="translate(590,290)"><line x1="-22" y1="0" x2="22" y2="0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
    <!-- genou D -->
    <g transform="translate(445,520)"><line x1="-22" y1="0" x2="22" y2="0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
    <!-- genou G -->
    <g transform="translate(515,520)"><line x1="-22" y1="0" x2="22" y2="0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
    <!-- cheville D -->
    <g transform="translate(443,675)"><line x1="-22" y1="0" x2="22" y2="0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
    <!-- cheville G -->
    <g transform="translate(517,675)"><line x1="-22" y1="0" x2="22" y2="0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
  </g>

  <!-- Rotules à doigt (poignets) -->
  <g stroke="#27406e">
    <g transform="translate(348,385)"><circle r="13" fill="url(#ball)" stroke-width="1.5"/><line x1="0" y1="0" x2="0" y2="-19" stroke-width="2.6"/><line x1="-5" y1="-19" x2="5" y2="-19" stroke-width="2.6"/></g>
    <g transform="translate(612,385)"><circle r="13" fill="url(#ball)" stroke-width="1.5"/><line x1="0" y1="0" x2="0" y2="-19" stroke-width="2.6"/><line x1="-5" y1="-19" x2="5" y2="-19" stroke-width="2.6"/></g>
  </g>

  <!-- ===== Étiquettes côté D (gauche) avec lignes de rappel ===== -->
  <g stroke="#aab2c0" stroke-width="0.8">
    <line x1="248" y1="185" x2="420" y2="185"/>
    <line x1="248" y1="290" x2="357" y2="290"/>
    <line x1="248" y1="385" x2="335" y2="385"/>
    <line x1="248" y1="470" x2="450" y2="356"/>
    <line x1="248" y1="560" x2="445" y2="528"/>
    <line x1="248" y1="670" x2="443" y2="678"/>
  </g>
  <g font-size="12.5" fill="#1c2b46" text-anchor="start">
    <text x="16" y="189">Épaule : <tspan font-weight="700">rotule</tspan> — 3 DDL (Rx,Ry,Rz)</text>
    <text x="16" y="294">Coude : <tspan font-weight="700">pivot</tspan> — 1 DDL (Rz, flexion)</text>
    <text x="16" y="389">Poignet : <tspan font-weight="700">rotule à doigt</tspan> — 2 DDL</text>
    <text x="16" y="474">Hanche : <tspan font-weight="700">rotule</tspan> — 3 DDL (Rx,Ry,Rz)</text>
    <text x="16" y="564">Genou : <tspan font-weight="700">pivot</tspan> — 1 DDL (Ry, flexion)</text>
    <text x="16" y="674">Cheville : <tspan font-weight="700">pivot</tspan> — 1 DDL (Ry)</text>
  </g>

  <!-- Étiquette tronc -->
  <g stroke="#aab2c0" stroke-width="0.8"><line x1="640" y1="250" x2="537" y2="250"/></g>
  <text x="646" y="246" font-size="12.5" fill="#1c2b46"><tspan font-weight="700">Tronc rigide</tspan> (encastrement) :</text>
  <text x="646" y="263" font-size="12" fill="#5a6a85">épine + cou + tête + clavicules</text>

  <!-- ===== Légende ===== -->
  <rect x="708" y="300" width="284" height="248" rx="10" fill="#f7f9fc" stroke="#c4ccd8" stroke-width="1.2"/>
  <text x="724" y="326" font-size="14" font-weight="700" fill="#1c2b46">Liaisons normalisées (ISO 3952)</text>

  <circle cx="742" cy="362" r="13" fill="url(#ball)" stroke="#2f4a78" stroke-width="1.5"/>
  <text x="770" y="358" font-size="12.5" fill="#1c2b46" font-weight="700">Rotule (sphérique)</text>
  <text x="770" y="374" font-size="11.5" fill="#5a6a85">3 rotations — épaule, hanche</text>

  <g transform="translate(742,408)"><rect x="-13" y="-8" width="26" height="16" rx="3" fill="url(#cyl)" stroke="#555" stroke-width="1.3"/><ellipse cx="-13" cy="0" rx="3.5" ry="8" fill="#eef2f8" stroke="#555" stroke-width="1.3"/><ellipse cx="13" cy="0" rx="3.5" ry="8" fill="#c2cde0" stroke="#555" stroke-width="1.3"/></g>
  <text x="770" y="404" font-size="12.5" fill="#1c2b46" font-weight="700">Pivot</text>
  <text x="770" y="420" font-size="11.5" fill="#5a6a85">1 rotation — coude, genou, cheville</text>

  <g transform="translate(742,456)"><circle r="13" fill="url(#ball)" stroke="#27406e" stroke-width="1.5"/><line x1="0" y1="0" x2="0" y2="-18" stroke="#27406e" stroke-width="2.6"/><line x1="-5" y1="-18" x2="5" y2="-18" stroke="#27406e" stroke-width="2.6"/></g>
  <text x="770" y="452" font-size="12.5" fill="#1c2b46" font-weight="700">Rotule à doigt</text>
  <text x="770" y="468" font-size="11.5" fill="#5a6a85">2 rotations — poignet</text>

  <rect x="730" y="494" width="24" height="20" rx="2" fill="#eef1f6" stroke="#3a4659" stroke-width="1.5"/>
  <rect x="730" y="494" width="24" height="20" rx="2" fill="url(#hatch)" opacity="0.4"/>
  <text x="770" y="502" font-size="12.5" fill="#1c2b46" font-weight="700">Encastrement</text>
  <text x="770" y="518" font-size="11.5" fill="#5a6a85">0 DDL — solide rigide</text>

  <!-- ===== Bilan DDL ===== -->
  <rect x="708" y="566" width="284" height="150" rx="10" fill="#f0f5ff" stroke="#9db4e0" stroke-width="1.2"/>
  <text x="724" y="590" font-size="14" font-weight="700" fill="#1c2b46">Bilan des degrés de liberté</text>
  <g font-size="12.5" fill="#34425c">
    <text x="724" y="614">Épaules&#160;&#160;2 × 3 = 6</text>
    <text x="724" y="634">Coudes&#160;&#160;&#160;2 × 1 = 2</text>
    <text x="724" y="654">Poignets&#160;2 × 2 = 4</text>
    <text x="724" y="674">Hanches&#160;&#160;2 × 3 = 6</text>
    <text x="724" y="694">Genoux + chevilles&#160;&#160;2 × (1+1) = 4</text>
  </g>
  <text x="724" y="712" font-size="13" font-weight="700" fill="#1c2b46">Total = 22 DDL</text>

  <!-- ===== Repère monde R0 ===== -->
  <g transform="translate(70,790)" stroke="#1c2b46" stroke-width="1.6">
    <line x1="0" y1="0" x2="50" y2="0"/>
    <polygon points="50,0 43,-3.5 43,3.5" fill="#1c2b46" stroke="none"/>
    <line x1="0" y1="0" x2="0" y2="-50"/>
    <polygon points="0,-50 -3.5,-43 3.5,-43" fill="#1c2b46" stroke="none"/>
    <circle cx="0" cy="0" r="4.5" fill="none"/>
    <circle cx="0" cy="0" r="1.4" fill="#1c2b46" stroke="none"/>
  </g>
  <g font-size="12.5" fill="#1c2b46">
    <text x="124" y="794">X</text>
    <text x="64" y="730">Y</text>
    <text x="84" y="806">Z (⊙)</text>
    <text x="46" y="812" font-weight="700">R0</text>
  </g>

  <!-- Note -->
  <text x="240" y="800" font-size="11.5" fill="#7a8499">Côté gauche (G) symétrique. Orientation des symboles indicative —</text>
  <text x="240" y="816" font-size="11.5" fill="#7a8499">cinématique exacte (axes, butées) définie dans Niko_v2_PRBE.urdf.</text>
</svg>
